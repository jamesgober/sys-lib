[package]
name = "sys-lib-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.sys-lib]
path = ".."
features = ["device-id"]

# Keeps this crate out of any parent workspace.
[workspace]
members = ["."]

# One target per parser (dev/PLAN.md section 19.4).

[[bin]]
name = "os_release"
path = "fuzz_targets/os_release.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release"
path = "fuzz_targets/release.rs"
test = false
doc = false
bench = false

[[bin]]
name = "version"
path = "fuzz_targets/version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cpu_list"
path = "fuzz_targets/cpu_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cpuinfo"
path = "fuzz_targets/cpuinfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cpu_name"
path = "fuzz_targets/cpu_name.rs"
test = false
doc = false
bench = false

[[bin]]
